# llmlint: ignore-file[crates_stay_in_one_cargo_workspace] SPIKE ONLY, on a branch that is kept and never landed: this probe is its own workspace on purpose, because it approximates the repository after the move (serde-saphyr and saphyr in, serde_yaml_ng out) so cargo-deny can judge that graph against deny.toml without the root workspace ever resolving the candidate crates.
# Run through the harness's `deny_probe` bin (../README.md).
[package]
name = "saphyr-deny-probe"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[workspace]

[dependencies]
onejudge = { path = "../../../crates/onejudge", default-features = false }
clap = { version = "4", features = ["derive"] }
serde-saphyr = "=1.3.0"
saphyr = "=0.2.1"

# The dependencies are the probe: cargo tree and cargo-deny read this crate's
# resolved graph, and no code ever uses them.
[package.metadata.cargo-machete]
ignored = ["onejudge", "clap", "serde-saphyr", "saphyr"]
