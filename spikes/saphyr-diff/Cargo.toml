# llmlint: ignore-file[crates_stay_in_one_cargo_workspace] SPIKE ONLY, on a branch that is kept and never landed: this harness is outside the root workspace on purpose, so the candidate YAML crates it measures (serde-saphyr, saphyr) never enter the root Cargo.lock, cargo-deny run or Nx graph before the move is approved; it commits no Cargo.lock of its own and pins the crates that decide what it measures exactly, below.
# Commands and helpers: README.md.
[package]
name = "saphyr-diff"
version = "0.0.0"
edition = "2021"
publish = false
default-run = "saphyr-diff"

[workspace]

[dependencies]
onejudge = { path = "../../crates/onejudge", features = ["cli", "skill"] }
serde_yaml_ng = "=0.10.0"
serde-saphyr = "=1.3.0"
saphyr = "=0.2.1"
# Not used directly: pinned so the parsers and the error renderer the findings
# were measured with resolve to the same versions without a committed lock.
granit-parser = "=1.3.0"
saphyr-parser = "=0.2.1"
annotate-snippets = "=0.12.16"
unsafe-libyaml = "=0.2.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
