# SPIKE ONLY — throwaway differential harness for plan
# authoring:serde-yaml-replacement (spike-onejudge-yaml). Its own workspace, so
# nothing it pulls (serde-saphyr, saphyr) reaches the repository's Cargo.lock or
# cargo-deny run. Run with
# `cargo run -q --release --manifest-path spikes/saphyr-diff/Cargo.toml`; the
# `deny_probe`, `capture` and `collect` bins are its helpers (README.md).
[package]
name = "saphyr-diff"
version = "0.0.0"
edition = "2021"
publish = false
default-run = "saphyr-diff"

[workspace]

[dependencies]
onejudge = { path = "../../crates/onejudge", features = ["cli", "skill"] }
serde_yaml_ng = "=0.10.0"
serde-saphyr = "=1.3.0"
saphyr = "=0.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
