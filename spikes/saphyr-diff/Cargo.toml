# SPIKE ONLY — the throwaway differential harness for plan
# authoring:serde-yaml-replacement (spike-onejudge-yaml); never lands. Commands
# and helpers: README.md.
[package]
name = "saphyr-diff"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
default-run = "saphyr-diff"

[dependencies]
onejudge = { path = "../../crates/onejudge", features = ["cli", "skill"] }
serde_yaml_ng = { workspace = true }
serde-saphyr = { workspace = true }
saphyr = { workspace = true }
serde = { workspace = true }
# `preserve_order`: the schema-less walk is measured on an insertion-ordered map.
serde_json = { workspace = true, features = ["preserve_order"] }
