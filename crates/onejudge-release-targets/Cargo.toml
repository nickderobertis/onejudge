# The release-target network tier (`tests/release_targets.rs`): what the public
# registries serve for every declared target, and whether the canonical schema
# moved upstream. Every test is `#[ignore]`-d; runs via `just
# test-release-targets` / the `release-targets` workflow.
[package]
name = "onejudge-release-targets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dev-dependencies]
onejudge-repo = { path = "../onejudge-repo" }
