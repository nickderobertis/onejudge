[package]
name = "onejudge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description.workspace = true
readme = "../../README.md"
keywords = ["llm", "agent", "evaluation", "oneharness", "judge"]
categories = ["development-tools::testing"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The oneharness boundary is parsed into oneharness's OWN typed report/stream
# contract rather than into shadow structs guessed by field name, so a change
# upstream is a compile error here instead of a silently-null field at runtime.
# Non-optional: `OneharnessProvider` is the default provider, so this is the
# library's core surface, not an opt-in extra.
oneharness-core = { workspace = true }
# Only pulled by the optional `cli` / `skill` features. A bare library consumer
# (`cargo add onejudge`) never sees clap or a YAML parser. `serde_yaml` is
# archived/unmaintained, so the maintained `serde_yaml_ng` fork parses both the
# CLI config and SKILL.md frontmatter. Both are opt-in, kept off the library's
# (and the MSRV's) default surface.
clap = { version = "4", features = ["derive"], optional = true }
serde_yaml_ng = { version = "0.10", optional = true }
schemars = { workspace = true, optional = true }

# Cancelling a turn signals the `oneharness run` child so it tears down the
# harness tree it owns (`oneharness/mod.rs`). Unix-only: Windows has no SIGTERM,
# and none is needed there — oneharness puts each harness tree in a Job Object
# with `KILL_ON_JOB_CLOSE`, so ending the child already ends its descendants.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }
# Only for the `fake-provider` double, which must *catch* SIGTERM to model
# oneharness's teardown (an uncatchable SIGKILL is exactly what this proves is not
# enough). Optional, so it never reaches a library consumer.
signal-hook = { workspace = true, optional = true }

[dev-dependencies]
# The contract drift gate (`tests/contract.rs`) serializes the public `Report`
# and diffs it against a checked-in golden.
serde_json = { workspace = true }
# `tests/release_targets.rs` holds `release-targets.toml` to the canonical
# release-target schema, and reads the Cargo/PyPI manifests the release
# configuration publishes from. A standard TOML parser rather than a hand-rolled
# one, because the schema promises exactly that of whoever reads the document.
# Already in the tree via `oneharness-core`, so this costs no new dependency.
toml = "1"

[features]
# The deterministic test doubles the e2e suite drives as real subprocesses.
# Non-default so a published `cargo add onejudge` / library build ships only the
# engine — the doubles are test-only. `just check` and coverage enable it.
fake-provider = ["dep:signal-hook"]

# Load a skill from disk (a `SKILL.md` directory) into a `SkillDefinition`. This is
# onejudge's owned skill-execution primitive — a higher-level framework composes
# over `load_skill` rather than re-implementing the SKILL.md format. Non-default so
# the YAML parser stays off a bare `cargo add onejudge`; the `cli` feature enables
# it (the CLI resolves a `skill:` path through it).
skill = ["dep:serde_yaml_ng"]

# The standalone `onejudge` binary: drive a harness through a simulated-user loop
# to complete one task, configured by YAML. Non-default so the library stays lean
# (clap + the YAML parser never reach a `cargo add onejudge` consumer). Pulls in
# `skill` for the `skill:` config key. The deterministic gate (`just check`) enables
# it alongside `fake-provider` and drives the built binary against the test doubles
# in `tests/cli.rs`.
cli = ["dep:clap", "skill"]

# Rust-owned JSON Schema metadata for SDK generators. Config is the CLI's YAML
# input contract, so this opt-in feature includes `cli`; bare library and CLI
# consumers do not compile schemars unless they explicitly request this surface.
sdk-schema = ["dep:schemars", "cli"]

[[example]]
name = "generate_sdk_schema"
required-features = ["sdk-schema"]

# The user-facing standalone binary, behind the `cli` feature. Unlike the two
# `fake-provider` doubles below, this one IS published and installed
# (`cargo install onejudge --features cli`, release archives). Its logic lives in
# the covered `cli` library modules; this entrypoint stays thin.
[[bin]]
name = "onejudge"
path = "src/bin/onejudge.rs"
required-features = ["cli"]

# `onejudge-echo-provider` speaks the CommandProvider JSON-lines protocol;
# `onejudge-fake-oneharness` emulates `oneharness run --format json`. Both are
# deterministic doubles for the e2e suite, gated behind `fake-provider` so they
# are never built into a normal library consumer's dependency graph.
[[bin]]
name = "onejudge-echo-provider"
path = "src/bin/echo_provider.rs"
required-features = ["fake-provider"]

[[bin]]
name = "onejudge-fake-oneharness"
path = "src/bin/fake_oneharness.rs"
required-features = ["fake-provider"]

# `onejudge-fake-harness` stands in one level deeper: a *harness* CLI, so a turn
# run through the linked `oneharness-core` engine has something deterministic to
# spawn. See its module doc.
[[bin]]
name = "onejudge-fake-harness"
path = "src/bin/fake_harness.rs"
required-features = ["fake-provider"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
