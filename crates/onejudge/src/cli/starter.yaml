# onejudge.yaml — drive a harness through a simulated-user loop to complete a
# task. Run with `onejudge run onejudge.yaml`. Flags and `ONEJUDGE_*` env vars
# override any field here (flags > env > file > defaults). See `onejudge schema`.
#
# Harness/model SELECTION lives in oneharness's own config files, not here:
#   - the agent side uses the discovered `oneharness.toml`;
#   - the judge / simulated user use `provider.judge_config` (default
#     `oneharness.judge.toml`).
# `onejudge init` scaffolds all three (it shells out to `oneharness init`).

# Which backend runs the harness (and judges / plays the simulated user).
provider:
  kind: oneharness                       # oneharness | command | split
  bin: oneharness                        # oneharness: the binary to shell out to
  judge_config: oneharness.judge.toml    # oneharness: judge/user `--config` file
  # stream: true                         # oneharness: the agent binary publishes
  #                                      # NDJSON tool events as they happen, then a
  #                                      # terminal report (see docs/streaming.md)
  # control: true                        # oneharness: open an out-of-band turn-control
  #                                      # socket for the AGENT turn, so a separate
  #                                      # `oneharness interrupt` can redirect it in
  #                                      # flight. Default false. The report's
  #                                      # `control` block is the address; a harness
  #                                      # that cannot be controlled degrades to a
  #                                      # `control_unavailable` reason rather than
  #                                      # failing the run (see docs/control.md)
  # mock_harness: [claude-code]          # oneharness: run these harness ids against
  #                                      # oneharness's own deterministic MOCK_*
  #                                      # responder instead of a paid model, on BOTH
  #                                      # sides. For a free acceptance proof: only
  #                                      # the model is scripted. Each id must be
  #                                      # selected by that side's config, and the run
  #                                      # spawns `bin` (see docs/cli.md)
  # kind: command  ->  command: ["my-provider", "--flag"]
  # kind: split    ->  skill: {..provider..}, judge: {..provider..}

# System framing for the harness. `skill` and `system_prompt` are both optional
# and combine: `system_prompt` comes first, then the skill's SKILL.md body.
# skill: ./skills/my-skill    # a directory containing SKILL.md (its body is used)
system_prompt: |              # extra system-prompt text (used alone, or with a skill)
  You are a senior engineer. Complete the task and keep tests green.

task: "Describe the task to complete here."

user:                         # one unified supervisor call decides done or supplies the next message
  persona: |
    You are a demanding tech lead reviewing the work. Push for tests and edge
    cases; do not accept "done" until you have verified it.
  done_when: "the task is complete and all tests pass"
  max_turns: 12

session: onejudge             # caller-owned session name, threaded across turns

evals:                        # optional: score the finished transcript
  - criterion: "the code compiles and tests pass"
    kind: boolean
  - criterion: "the change is well-scoped and readable"
    kind: numeric
    scale: [1, 5]

assessment: null              # optional: free-text judgement of the finished transcript
# assessment: "Identify useful follow-up work that was left out of scope."
