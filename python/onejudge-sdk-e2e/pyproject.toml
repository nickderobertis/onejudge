# The installed-wheel journey for the Python SDK (`package_e2e.py`): build the
# `onejudge` SDK wheel from ../onejudge-sdk, install it into a fresh venv, and drive
# the real `onejudge` binary through its public import. A project of its own in
# the Nx graph (`project.json`), never a distribution: nothing here is built or
# published. It runs in the SDK's pinned tool environment
# (../onejudge-sdk/requirements-dev.txt) and is linted and type-checked under the
# SDK's mypy configuration and a ruff configuration extending the SDK's.
[project]
name = "onejudge-sdk-e2e"
version = "0.0.0"
description = "Installed-wheel journey for the onejudge Python SDK (never published)"
requires-python = ">=3.9"
dependencies = []

[tool.uv]
package = false

[tool.ruff]
extend = "../onejudge-sdk/pyproject.toml"

[tool.ruff.lint.per-file-ignores]
# A journey that builds, installs and runs things: subprocess calls and asserts
# are its job, as they are for the SDK's own `test/**`.
"*.py" = ["S101", "S404", "S603", "S607"]
