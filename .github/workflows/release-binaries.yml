# Cross-platform release archives for the `onejudge` CLI. release-plz publishes
# the library to crates.io and tags `vX.Y.Z` (with a PAT, so this tag push fires
# downstream workflows); this job builds the standalone binary for each supported
# target and attaches the archives to that tag's GitHub Release, so `install.sh`
# (and a manual download) have artifacts to fetch. The library publish is
# unaffected — this only adds the binary install path (issue #8).

name: release-binaries

on:
  push:
    tags: ["v*.*.*", "onejudge-v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
      diagnostic_rebuild:
        description: Explicitly rebuild missing Darwin artifacts outside the automatic lifecycle
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  archives:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (from rust-toolchain.toml)
        run: rustup show
      - uses: extractions/setup-just@v3
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      - name: Build the release binary
        # Same recipe the `cli-binary` PR job runs, just cross-compiled per target.
        run: just build-cli ${{ matrix.target }}
      # The archive is named `onejudge-<target>.(tar.gz|zip)`. install.sh's
      # download URL assumes this exact naming and its os/arch cases mirror this
      # matrix's `target`s; `just check-release-targets` (in the gate) enforces
      # that install.sh's targets stay a subset of this matrix.
      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          staging="onejudge-${{ matrix.target }}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/onejudge" "$staging/"
          cp README.md LICENSE "$staging/"
          tar czf "$staging.tar.gz" "$staging"
          echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"
      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          staging="onejudge-${{ matrix.target }}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/onejudge.exe" "$staging/"
          cp README.md LICENSE "$staging/"
          7z a "$staging.zip" "$staging"
          echo "ASSET=$staging.zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish-archives:
    needs: archives
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: archives
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: archives/*
          tag_name: ${{ github.ref_name }}

  darwin-plan:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.diagnostic_rebuild)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      name: ${{ steps.plan.outputs.name }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 pypi/producer_plan.py >> "$GITHUB_OUTPUT"

  darwin:
    needs: darwin-plan
    if: needs.darwin-plan.outputs.build == 'true'
    runs-on: macos-15
    # These target declarations are also read by the release-platform drift gate.
    env:
      TARGETS: x86_64-apple-darwin aarch64-apple-darwin
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      VERSION: ${{ needs.darwin-plan.outputs.version }}
      TAG: ${{ needs.darwin-plan.outputs.tag }}
      SHA: ${{ needs.darwin-plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.darwin-plan.outputs.sha }}
      - name: Check out this workflow's release tooling
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          persist-credentials: false
      - name: Install pinned toolchain (from rust-toolchain.toml)
        run: rustup show
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v6
      - name: Add both Darwin targets
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - name: Enable Rosetta for the Intel install journey
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: Build, package, install and run each architecture sequentially
        run: |
          test "$(uname -m)" = arm64
          for target in $TARGETS; do
            just --justfile .release-tools/justfile --working-directory "$PWD" pypi-release "$target" dist .release-tools/
            python3 .release-tools/pypi/smoke_release.py --target "$target" --root dist --version "$VERSION"
          done
          python3 .release-tools/pypi/release_artifacts.py stage --root dist --tag "$TAG" --sha "$SHA" --version "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.darwin-plan.outputs.name }}
          path: dist/*
          if-no-files-found: error

  publish-darwin:
    needs: [darwin-plan, darwin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.darwin-plan.outputs.name }}
          path: dist
      - name: Verify and persist the exact producer output
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.darwin-plan.outputs.tag }}
          SHA: ${{ needs.darwin-plan.outputs.sha }}
          VERSION: ${{ needs.darwin-plan.outputs.version }}
          NAME: ${{ needs.darwin-plan.outputs.name }}
        run: |
          python3 pypi/release_artifacts.py verify --root dist --tag "$TAG" --sha "$SHA" --version "$VERSION"
          (cd dist && zip "../$NAME.zip" ./*)
          storage_tag=$(python3 pypi/release_storage.py --repo "$GITHUB_REPOSITORY" --tag "$TAG" --sha "$SHA" --version "$VERSION")
          gh release upload "$storage_tag" "$NAME.zip" dist/onejudge-*.tar.gz --clobber
