# Prove the artifact from a clean checkout: bootstrap the dev toolchain, then run
# the gate at the tier this run is for. The pinned toolchain comes from
# rust-toolchain.toml (rustup reads it), so local and CI run the same compiler.
# See the create-repo skill's ci.md, "Staged gates".
#
# Tiers (scripts/ci-tier.mjs decides, from the event): pull requests and pushes to
# main run the AFFECTED tier against an explicitly derived merge base; release-plz's
# release pull request runs the BROADER tier, because releases are batched there
# (AGENTS.md, "Commits, releases, and merging"), and the push that lands it is not
# gated again.

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: read-only by default, widened per job only where needed.
permissions:
  contents: read

jobs:
  # THE gate: format, lint, doc, the generated-contract checks, coverage-enforced
  # tests (incl. e2e and the Python SDK) and the drift checks of every affected
  # project; the release PR's broader sweep adds the supply-chain audit.
  # Linux-only, because coverage and the audit run once (not per-OS).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the merge base the affected tier is keyed off
      - name: Install pinned toolchain (from rust-toolchain.toml)
        run: rustup show
      - uses: extractions/setup-just@v3
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: astral-sh/setup-uv@v6   # the Python SDK's projects run inside this gate
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov,cargo-deny,cargo-machete
      - name: Bootstrap
        run: just bootstrap
      - name: Select the gate tier
        id: tier
        run: node scripts/ci-tier.mjs >> "$GITHUB_OUTPUT"
      - name: Check
        if: steps.tier.outputs.tier != 'skip'
        env:
          NX_BASE: ${{ steps.tier.outputs.base }}
          FLAGS: ${{ steps.tier.outputs.flags }}
        run: |
          [ -n "$NX_BASE" ] || unset NX_BASE
          just check ${FLAGS:+"$FLAGS"}

  # The Python SDK's targets alone, as the SDK's own status (`just
  # python-sdk-check`); the `check` job above runs the same targets inside the gate.
  python-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (from rust-toolchain.toml)
        run: rustup show
      - uses: extractions/setup-just@v3
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: astral-sh/setup-uv@v6
      - name: Check Python SDK
        run: just python-sdk-check

  # Portability: the affected Rust suites (no coverage/audit) on macOS and
  # Windows, so the engine and its real-subprocess e2e are proven cross-platform —
  # at the same tier, against the same base, as `check`.
  test-os:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned toolchain (from rust-toolchain.toml)
        run: rustup show
      - uses: extractions/setup-just@v3
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Select the gate tier
        id: tier
        shell: bash
        run: node scripts/ci-tier.mjs >> "$GITHUB_OUTPUT"
      - name: Test
        # test-fast (plain nextest, no coverage): coverage is enforced once, on
        # the Linux `check` job; these prove the engine + e2e are cross-platform.
        if: steps.tier.outputs.tier != 'skip'
        shell: bash
        env:
          NX_BASE: ${{ steps.tier.outputs.base }}
          FLAGS: ${{ steps.tier.outputs.flags }}
        run: |
          [ -n "$NX_BASE" ] || unset NX_BASE
          just test-fast ${FLAGS:+"$FLAGS"}

  # MSRV: the crate still builds on the declared minimum Rust (Cargo.toml
  # `rust-version`). A real, checked commitment, not just documentation.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MSRV toolchain
        run: rustup toolchain install 1.89.0 --profile minimal
      - uses: extractions/setup-just@v3
      - uses: oven-sh/setup-bun@v2   # `just msrv` runs `workspace:msrv` through Nx
        with:
          bun-version-file: package.json
      - run: just msrv

  # Prove the end-user install path: the publishable crate packages cleanly and
  # builds from its packaged form — what a consumer gets from `cargo add onejudge`.
  # Separate from the dev gate, which never packages.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (from rust-toolchain.toml)
        run: rustup show
      - name: Package (verify the publishable artifact builds)
        run: cargo publish --dry-run -p onejudge --locked

  # Prove the SHIPPED CLI binary builds and runs — the release-archive artifact a
  # user installs (`install.sh` / `cargo install onejudge --features cli`). Proven
  # here on every PR — a tag push then builds the same binary per-platform in
  # `release-binaries.yml`. The deterministic CLI e2e (`tests/cli.rs`) runs inside
  # `check`.
  cli-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (from rust-toolchain.toml)
        run: rustup show
      - uses: extractions/setup-just@v3
      - name: Build the shipped binary
        run: just build-cli
      - name: Smoke-test the binary
        run: ./target/release/onejudge schema >/dev/null

  # LLM-judge tier (llmlint) — a blocking PR check, SEPARATE from `check`. It is
  # non-deterministic and needs an authenticated harness, so it never runs inside
  # `just check`. Scoped to the merge-base diff so a PR pays for its own changes.
  # It REQUIRES the harness credential and fails fast without it — never no-ops to
  # green. Fork PRs are gated by the repo's require-approval-for-fork-workflows
  # setting (see references/ci.md), not by a no-op branch here.
  llmlint:
    if: github.event_name == 'pull_request' && github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Fetch main (diff base)
        run: git fetch --no-tags --depth=2147483647 origin main
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v6   # setup-llmlint.sh installs oneharness + llmlint via `uv tool`
      - name: Install the Claude Code harness
        # oneharness.toml's fallback chain resolves to claude-code here (codex is
        # absent); oneharness shells out to the `claude` binary, so it must be on PATH.
        run: npm install -g @anthropic-ai/claude-code
      - name: Install oneharness + llmlint
        run: |
          ./scripts/setup-llmlint.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate llmlint config (deterministic, no credential)
        # Config, ignore directives and fragment version bumps — no model call, so a
        # broken config fails here before the paid step below spends a harness call.
        run: just lint-llm-validate --diff-base origin/main
      - name: Lint changed files
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::llmlint needs a harness credential (CLAUDE_CODE_OAUTH_TOKEN)." \
                 "Add the repo secret (Settings → Secrets and variables → Actions)." \
                 "Fork PRs are gated by require-approval-for-fork-workflows; see references/ci.md." >&2
            exit 1
          fi
          just lint-llm-diff origin/main

  # The llmlint judge against the RELEASED llmlint, installed at the provider's
  # floor by the same script sessions use: the labels onejudge passes are ones
  # llmlint accepts and records, and each decision's `run_id` is the id
  # `llmlint history` answers with. No model call and no credential.
  llmlint-real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (from rust-toolchain.toml)
        run: rustup show
      - uses: extractions/setup-just@v3
      - uses: oven-sh/setup-bun@v2   # `just test-llmlint` runs `onejudge-llmlint-real:test` through Nx
        with:
          bun-version-file: package.json
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: astral-sh/setup-uv@v6   # setup-llmlint.sh installs llmlint via `uv tool`
      - name: Install llmlint at the floor
        run: |
          ./scripts/setup-llmlint.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Real-llmlint journey
        run: just test-llmlint

  # Lint the PR title as a required check: under squash-merge it becomes the one
  # commit that lands and that release-plz reads, so a malformed title must not
  # merge. The required context is named `commitlint` in branch protection.
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
