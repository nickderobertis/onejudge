# Build platform wheels for a published GitHub Release and, when explicitly
# enabled, publish them through PyPI Trusted Publishing. release-plz owns the
# Cargo version and Release; maturin reads that same version for onejudge-cli.
# The SDK is stamped from that Cargo version when its distributions are built.
#
# A Release whose upload did not finish is completed by hand, naming its tag:
#
#   gh workflow run release-pypi.yml -f tag=onejudge-v0.19.0
#
# That run is this file as it stands on the default branch, but it builds the
# tag's tree and uploads only what PyPI does not already hold at the tag's
# version. `scripts/release-pypi-plan.sh` makes both decisions (the `plan` job);
# a rerun of a tag's own run would instead replay the workflow as it stood then.

name: release-pypi

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to complete, e.g. onejudge-v0.19.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-pypi-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  # The tag, its commit and version, and which distributions to upload. Every
  # later checkout is `needs.plan.outputs.sha`, the tag's tree.
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      upload-cli: ${{ steps.plan.outputs.upload-cli }}
      upload-sdk: ${{ steps.plan.outputs.upload-sdk }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: plan
        run: ./scripts/release-pypi-plan.sh

  # A manually published Release takes the same gate as a release-plz Release:
  # no wheel can build or publish from a revision that fails `just check`.
  test:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      # llmlint: ignore-block[no_second_broader_sweep_over_an_already_gated_commit, release_does_not_regate_an_already_swept_commit] A Release published by hand, or a hand-run naming its tag, was never swept by a release PR.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      # llmlint: ignore-end[no_second_broader_sweep_over_an_already_gated_commit, release_does_not_regate_an_already_swept_commit]
      - name: Install pinned toolchain (from rust-toolchain.toml)
        run: rustup show
      - uses: extractions/setup-just@v3
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov,cargo-deny,cargo-machete
      - run: just bootstrap
      - run: just check

  build-cli-wheels:
    name: build-cli-wheel (${{ matrix.target }})
    needs: [plan, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Build onejudge-cli wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-cli-${{ matrix.target }}
          path: dist/*

  # Build the generated SDK at the Cargo release version with an exact CLI pin.
  build-sdk:
    needs: [plan, test]
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.sdk.outputs.exists }}
    steps:
      # llmlint: ignore-block[no_second_broader_sweep_over_an_already_gated_commit, release_does_not_regate_an_already_swept_commit, work_goes_through_command_surface] The SDK check is this job's existing guard on what it builds. `rustup show` is the toolchain step every workflow here runs, under this name, ahead of `just`.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      # Before the check: its Nx tasks run in parallel, and each one that finds
      # the toolchain missing installs its components at once, which collide.
      - name: Install pinned toolchain (from rust-toolchain.toml)
        run: rustup show
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v6
      - run: just python-sdk-check
      # llmlint: ignore-end[no_second_broader_sweep_over_an_already_gated_commit, release_does_not_regate_an_already_swept_commit, work_goes_through_command_surface]
      - name: Build version-synchronized onejudge
        id: sdk
        shell: bash
        run: |
          if [ -f python/onejudge-sdk/pyproject.toml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            pkgdir="$(python python/onejudge-sdk/scripts/pack.py)"
            uv build --out-dir sdk-dist "$pkgdir"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "onejudge does not exist yet; skipping its distributions."
          fi
      - uses: actions/upload-artifact@v4
        if: steps.sdk.outputs.exists == 'true'
        with:
          name: pypi-sdk
          path: sdk-dist/*
          if-no-files-found: ignore

  # Publishing is intentionally dormant until the repository owner registers
  # the Trusted Publisher and explicitly enables the repository variable.
  # A distribution the plan did not select is already on PyPI: its step is
  # skipped and the job still succeeds, so the jobs after it run.
  publish-cli:
    needs: [plan, build-cli-wheels]
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.upload-cli == 'true'
        with:
          pattern: pypi-cli-*
          path: dist
          merge-multiple: true
      - name: Publish onejudge-cli
        if: needs.plan.outputs.upload-cli == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  # The SDK's exact CLI dependency must already be publishable before the SDK
  # itself lands, so this job is explicitly ordered after publish-cli.
  publish-sdk:
    needs: [plan, publish-cli, build-sdk]
    if: ${{ vars.PYPI_PUBLISH == 'true' && needs.build-sdk.outputs.exists == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.upload-sdk == 'true'
        with:
          name: pypi-sdk
          path: dist
      - name: Publish onejudge
        if: needs.plan.outputs.upload-sdk == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  # Prove both synchronized distributions are resolvable after registry propagation.
  verify-pypi:
    needs: [plan, publish-sdk]
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and verify the published CLI and SDK
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          ver="$VERSION"
          url="https://pypi.org/pypi/onejudge/${ver}/json"
          for i in $(seq 1 30); do
            curl -fsSL -o /dev/null "$url" 2>/dev/null && break
            if [ "$i" = 30 ]; then
              echo "::error::onejudge $ver did not appear on PyPI within ~5 minutes"
              exit 1
            fi
            sleep 10
          done
          pip install "onejudge==${ver}"
          python - "$ver" <<'PY'
          import sys
          from importlib.metadata import version
          from onejudge_sdk import __version__

          expected = sys.argv[1]
          assert __version__ == expected
          assert version("onejudge") == expected
          assert version("onejudge-cli") == expected
          PY
          onejudge --version | grep -F "$ver"
