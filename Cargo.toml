[workspace]
resolver = "2"
members = ["crates/onejudge"]

[workspace.package]
version = "0.13.5"
edition = "2021"
# Floored by `onemessagebus` / `onemessagebus-agent`, whose note contract and
# frame schemas onejudge re-exports and registers (they declare 1.89; the
# `oneharness-core` floor beneath them is 1.86). See `just msrv`.
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/nickderobertis/onejudge"
authors = ["Nick DeRobertis"]
description = "A simulated interaction and evaluation loop over oneharness: drive a harness through a multi-turn conversation and score the transcript."

[workspace.dependencies]
# oneharness's own engine crate. onejudge depends on it for the **wire contract**
# of the boundary it drives — `RunReport` / `RunResult` / `FailureKind` /
# `RunStreamEnvelope` — instead of re-declaring shadow serde structs that drift.
# 0.18.0 is the floor that resolves a config file's `extends` chain — a parent
# config the file inherits from, which an older core refuses as an unknown key —
# so an agent-side config onejudge hands over may name its harness only in a
# parent. Downstream engines that link onejudge hold one copy of the core and
# take that only through this requirement (a `^0.17` lock cannot resolve it).
# The spawned CLI floor is gated separately, on the report schema, in
# `cli/mod.rs`. A published registry version, never a git rev.
oneharness-core = "0.18.0"
# The message bus and its agent profile. The note contract onejudge accepts
# (`Note`, `Accepted`, `Undelivered`, the `Notes` / `NoteInbox` channel) is
# declared once in `onemessagebus_agent::note` and re-exported here, and the
# command-provider frames are registered as schemas in the bus's registry.
# Published registry versions, never a git rev. Kept on the bus release the
# crates that link onejudge (oneagentgraph, onepipeline) require: they hold one
# copy of the bus across their seams and cannot move until onejudge does.
onemessagebus = "0.8.0"
onemessagebus-agent = "0.8.0"
# Unix only, and for exactly one call: `kill(pid, SIGTERM)` to ask a cancelled
# `oneharness run` to tear down the harness tree it owns (`oneharness/mod.rs`).
# A safe wrapper, because this crate forbids `unsafe_code`; already in the tree
# via `oneharness-core`, so this costs a feature and no new dependency.
rustix = { version = "1", features = ["process"] }
# Safe signal registration for the `fake-provider` double that models oneharness's
# cancellation contract. Test-only: never enabled for a library consumer.
signal-hook = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
schemars = "1"

[profile.dev]
# Faster incremental e2e: the suite spawns the test-double binaries many times,
# so a cheap debug build beats optimizing the doubles. The profile's debuginfo
# level (`debug = 1`) lives in `.cargo/config.toml`, and the two tables merge.
opt-level = 0
