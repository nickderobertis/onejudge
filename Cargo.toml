[workspace]
resolver = "2"
# The published library, its test doubles, and one test-only crate per suite
# tier, so each tier is a project of its own in the Nx graph (`nx.json`).
members = [
    "crates/onejudge",
    "crates/onejudge-test-doubles",
    "crates/onejudge-e2e",
    "crates/onejudge-cli-e2e",
    "crates/onejudge-live",
    "crates/onejudge-llmlint-real",
    "crates/onejudge-release-targets",
    "crates/onejudge-repo",
]

[workspace.package]
version = "0.18.0"
edition = "2021"
# Floored by `onemessagebus`, whose bus core carries the note channel and the
# registry onejudge's frame schemas are registered in (it declares 1.89; the
# `oneharness-core` floor beneath it is 1.86). See `just msrv`.
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/nickderobertis/onejudge"
authors = ["Nick DeRobertis"]
description = "A simulated interaction and evaluation loop over oneharness: drive a harness through a multi-turn conversation and score the transcript."

[workspace.dependencies]
# oneharness's own engine crate. onejudge depends on it for the **wire contract**
# of the boundary it drives — `RunReport` / `RunResult` / `FailureKind` /
# `RunStreamEnvelope` — instead of re-declaring shadow serde structs that drift.
# 0.24.0 is the floor that records a run's history without reading the legacy
# index or walking the store: each run and event is indexed in a dated segment
# under `<history_dir>/.index.d/`, so recording costs the same however much
# history a host holds (listings default to the last 7 UTC days). 0.21.0 brought
# the public text renderer (`domain::render`) that draws the worker's events in
# `--format text` and the agent's own `message` / `reasoning` items as events;
# 0.18.0 resolved a config file's `extends` chain, so an agent-side config may
# name its harness only in a parent. Downstream engines that link onejudge hold
# one copy of the core and take that only through this requirement (a `^0.21`
# lock cannot resolve it).
# The spawned CLI floor is gated separately, on the report schema, in
# `cli/mod.rs`. A published registry version, never a git rev.
oneharness-core = "0.24.0"
# The message bus core, and nothing of any product's vocabulary: what it supplies
# is generic — the `Sender`/`Inbox` channel notes ride, and the registry the
# command-provider frames are registered in. A published registry version, never
# a git rev. Whatever this names is what the crates that link onejudge
# (oneagentgraph, onepipeline) must link too: they hold one copy of the bus
# across their seams, so moving it here moves it for them.
onemessagebus = "0.9.0"
# Unix only, and for exactly one call: `kill(pid, SIGTERM)` to ask a cancelled
# `oneharness run` to tear down the harness tree it owns (`oneharness/mod.rs`).
# A safe wrapper, because this crate forbids `unsafe_code`; already in the tree
# via `oneharness-core`, so this costs a feature and no new dependency.
rustix = { version = "1", features = ["process"] }
# Safe signal registration for the `onejudge-fake-oneharness` double that models
# oneharness's cancellation contract. Test-only: only the `publish = false`
# `onejudge-test-doubles` crate depends on it.
signal-hook = "0.3"
# Parsers the repo-level suites read the release configuration and the CI
# workflows with. Both already in the tree (via `oneharness-core` and the `skill`
# feature), so they cost no new dependency.
toml = "1"
serde_yaml_ng = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
schemars = "1"

[profile.dev]
# Faster incremental e2e: the suite spawns the test-double binaries many times,
# so a cheap debug build beats optimizing the doubles. The profile's debuginfo
# level (`debug = 1`) lives in `.cargo/config.toml`, and the two tables merge.
opt-level = 0
