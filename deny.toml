# cargo-deny configuration. Run via `just audit` (and in the CI supply-chain
# job). Strict: security advisories and disallowed licenses fail the run.

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licenses accepted for a published, redistributable crate.
allow = [
    "MIT",
    # MIT with the attribution clause dropped — strictly more permissive than MIT,
    # which is already allowed. Reached via oneharness-core -> jsonschema ->
    # fluent-uri -> borrow-or-share.
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# The YAML crates built on libyaml's C-to-Rust translation, which RUSTSEC-2024-0449
# flags. Re-entering the graph, directly or through a dependency, fails the gate.
deny = [
    { crate = "serde_yaml", reason = "RUSTSEC-2024-0449: a libyaml translation (unsafe-libyaml); YAML is read through serde-saphyr" },
    { crate = "serde_yaml_ng", reason = "RUSTSEC-2024-0449: a libyaml translation (unsafe-libyaml); YAML is read through serde-saphyr" },
    { crate = "serde_norway", reason = "RUSTSEC-2024-0449: a libyaml translation (unsafe-libyaml); YAML is read through serde-saphyr" },
    { crate = "serde_yml", reason = "RUSTSEC-2024-0449: a libyaml translation (unsafe-libyaml); YAML is read through serde-saphyr" },
    { crate = "unsafe-libyaml", reason = "RUSTSEC-2024-0449: a libyaml translation (unsafe-libyaml); YAML is read through serde-saphyr" },
    { crate = "unsafe-libyaml-norway", reason = "RUSTSEC-2024-0449: a libyaml translation (unsafe-libyaml); YAML is read through serde-saphyr" },
    { crate = "libyml", reason = "RUSTSEC-2024-0449: a libyaml translation (unsafe-libyaml); YAML is read through serde-saphyr" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
